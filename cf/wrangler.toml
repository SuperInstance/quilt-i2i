name = "i2i-ledger"
main = "src/worker.js"
compatibility_date = "2026-09-01"

# D1 — the ledger table (schema.sql)
# database_id must be filled in after `wrangler d1 create i2i-ledger` (see README-DEPLOY.md step 3).
[[d1_databases]]
binding = "DB"
database_name = "i2i-ledger"
database_id = "fa85916d-e414-4673-8610-2a73cf015c63"

# Vectorize — the shared semantic index (bge-m3, 1024 dims, cosine)
[[vectorize]]
binding = "INDEX"
index_name = "i2i-index"

# Workers AI — embeddings (@cf/baai/bge-m3)
[ai]
binding = "AI"
